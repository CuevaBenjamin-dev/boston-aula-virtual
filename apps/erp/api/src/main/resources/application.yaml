server:
  port: 8080
  servlet:
    session:
      timeout: ${BOSTON_ERP_SESSION_TIMEOUT:12h}
spring:
  application:
    name: api-erp-boston
  modulith:
    detection-strategy: explicitly-annotated
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/erp_boston_nuevo}
    username: ${SPRING_DATASOURCE_USERNAME:boston}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
  session:
    timeout: ${BOSTON_ERP_SESSION_TIMEOUT:12h}
    jdbc:
      initialize-schema: never
  security:
    oauth2:
      client:
        registration:
          boston-erp:
            provider: boston
            client-id: erp-web
            client-secret: ${BOSTON_ERP_WEB_SECRET:cambiar-local-erp-web}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: http://127.0.0.1:8089/login/oauth2/code/boston-erp
            scope: openid,profile
        provider:
          boston:
            authorization-uri: http://127.0.0.1:9000/oauth2/authorize
            token-uri: ${BOSTON_TOKEN_URI:http://localhost:9000/oauth2/token}
            jwk-set-uri: ${BOSTON_JWKS_URI:http://localhost:9000/oauth2/jwks}
            user-info-uri: http://identidad:9000/userinfo
            user-name-attribute: sub
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    path: /api/erp/v1/openapi
