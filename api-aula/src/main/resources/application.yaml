server:
  port: 8080
  servlet:
    session:
      cookie:
        name: AULA_SESSION
        http-only: true
        same-site: lax
spring:
  application:
    name: api-aula-boston
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aula_boston}
    username: ${SPRING_DATASOURCE_USERNAME:boston}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          boston:
            provider: boston
            client-id: aula-bff
            client-secret: ${BOSTON_BFF_SECRET:cambiar-local-bff}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8088/login/oauth2/code/boston
            scope: openid,profile
        provider:
          boston:
            authorization-uri: http://localhost:9000/oauth2/authorize
            token-uri: ${BOSTON_TOKEN_URI:http://localhost:9000/oauth2/token}
            jwk-set-uri: ${BOSTON_JWKS_URI:http://localhost:9000/oauth2/jwks}
            user-info-uri: http://identidad:9000/userinfo
            user-name-attribute: sub
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

