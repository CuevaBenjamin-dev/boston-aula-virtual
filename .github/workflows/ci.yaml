name: CI local reproducible
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        proyecto: [apps/erp/api, apps/aula/api, services/identidad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ${{ matrix.proyecto }}/pom.xml
      - name: Compilar y probar, incluidos límites Spring Modulith en ERP
        run: mvn -B -ntp -f '${{ matrix.proyecto }}/pom.xml' verify
  erp-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/erp/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/erp/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: erp-web-dist
          path: apps/erp/web/dist
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
